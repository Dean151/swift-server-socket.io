name: Linux CI

on:
  push:
    paths-ignore:
      - "README.md"
      - "Sources/**/*.docc/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "Sources/**/*.docc/**"

jobs:
  swift-tests:
    name: Swift Tests (Swift ${{ matrix.swift }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3"]
    container:
      image: swift:${{ matrix.swift }}-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run tests
        run: swift test

  protocol-tests:
    name: Socket.IO Protocol Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build socket-runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: socket-runner
          tags: swift-server-socket-io:socket-runner
          load: true
          cache-from: type=gha,scope=socket-runner
          cache-to: type=gha,mode=max,scope=socket-runner
      - name: Build socket-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: socket-test
          tags: swift-server-socket-io:socket-test
          load: true
          cache-from: type=gha,scope=socket-test
          cache-to: type=gha,mode=max,scope=socket-test
      - name: Run socket.io protocol tests
        run: docker compose run --rm socket-test
      - name: Tear down containers
        if: always()
        run: docker compose down --remove-orphans
